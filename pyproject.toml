[project]
name = "latent-alpha"
version = "0.1.0"
description = "Causal, reproducible equity alpha research stack"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "gymnasium>=0.29.0",
    "lightgbm",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "stable-baselines3>=2.3.0",
    "ta>=0.11.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
